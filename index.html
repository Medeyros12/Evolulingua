<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Fonético IPA</title>
    <link href="https://fonts.googleapis.com/css2?family=Gentium+Plus:ital,wght@0,400;0,700;1,400&family=Noto+Sans+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        
    </style>
</head>
<body>

    <div id="right-panel">
        <h3 style="margin-top:0; color:#2c3e50;">Fonotática (IPA)</h3>
        
        <small style="color: #666;">Clique no campo e depois no símbolo:</small>
        <div id="ipa-keyboard">
            <span class="ipa-key">ə</span> <span class="ipa-key">ɛ</span> <span class="ipa-key">ɔ</span> 
            <span class="ipa-key">æ</span> <span class="ipa-key">ɑ</span> <span class="ipa-key">y</span> 
            <span class="ipa-key">ø</span> <span class="ipa-key">œ</span> <span class="ipa-key">ɯ</span> 
            <span class="ipa-key">ɨ</span> <span class="ipa-key">ʊ</span> <span class="ipa-key">ɪ</span>
            <span class="ipa-key">ʃ</span> <span class="ipa-key">ʒ</span> <span class="ipa-key">θ</span> 
            <span class="ipa-key">ð</span> <span class="ipa-key">ŋ</span> <span class="ipa-key">ʔ</span> 
            <span class="ipa-key">ɾ</span> <span class="ipa-key">ʁ</span> <span class="ipa-key">χ</span> 
            <span class="ipa-key">ɲ</span> <span class="ipa-key">ʎ</span> <span class="ipa-key">ts</span> 
            <span class="ipa-key">tʃ</span> <span class="ipa-key">dʒ</span> <span class="ipa-key">ʰ</span>
            <span class="ipa-key">ː</span>
        </div>

        <div class="input-group">
            <label>Consoantes (C)</label>
            <input type="text" id="inp-consonants" class="ipa-input" value="p b t d k g m n s z l ɾ j w">
        </div>
        <div class="input-group">
            <label>Vogais (V)</label>
            <input type="text" id="inp-vowels" class="ipa-input" value="a e i o u">
        </div>
        <div class="input-group">
            <label>Consoantes Finais (F)</label>
            <input type="text" id="inp-finals" class="ipa-input" value="s l ɾ n">
        </div>
        <div class="input-group">
            <label>Semivogais (S)</label>
            <input type="text" id="inp-semivowels" class="ipa-input" value="j w">
        </div>
        <div class="input-group">
            <label>Estrutura da Sílaba</label>
            <input type="text" id="inp-structure" class="ipa-input" value="C V F?">
        </div>
        <div class="input-group">
            <label>Sílabas (Min-Max)</label>
            <input type="text" id="inp-syllables" value="2-3">
        </div>

        <button class="primary" onclick="generateRootLanguage()" style="margin-top: 15px;">Gerar Língua Raiz</button>
        
        <hr style="width:100%; border: 0; border-top: 1px solid #ddd; margin: 20px 0;">
        
        <label>Gerenciamento</label>
        <div class="btn-row">
            <button onclick="saveProject()">Salvar .JSON</button>
            <button onclick="document.getElementById('file-load-project').click()">Carregar .JSON</button>
            <input type="file" id="file-load-project" style="display: none;" onchange="loadProject(this)">
        </div>
    </div>

    <div id="top-panel">
        <div style="display: flex; justify-content: space-between; align-items: flex-end; height: 100%;">
            <div style="flex-grow: 1; margin-right: 25px; display: flex; flex-direction: column; height: 100%;">
                <h3 style="margin: 0 0 5px 0; color: #444;">Língua: <span id="current-lang-name" class="ipa-text" style="color: #2c3e50; font-weight: bold;">(Nenhuma)</span></h3>
                <div id="word-list-area">Use o painel à direita para começar.</div>
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 8px; min-width: 220px;">
                <label style="margin-bottom: 0; font-size: 0.75em;">Léxico</label>
                <div class="btn-row">
                    <button id="btn-add-words" onclick="generateMoreWords()" disabled>+ Palavras</button>
                    <button id="btn-export-txt" onclick="exportWords()" disabled>Exportar</button>
                    <button id="btn-import-txt" onclick="document.getElementById('file-import-words').click()" disabled>Importar</button>
                    <input type="file" id="file-import-words" style="display: none;" onchange="importWords(this)">
                </div>
                
                <div style="border-top: 1px solid #ddd; margin: 5px 0;"></div>
                
                <label style="margin-bottom: 0; font-size: 0.75em;">Evolução Fonética</label>
                <div class="btn-row">
                    <button class="primary" id="btn-evo-rand" onclick="evolveRandom()" disabled>Aleatória</button>
                    <button id="btn-evo-man" onclick="openManualEvo()" disabled>Manual / Regex</button>
                </div>
            </div>
        </div>
    </div>

    <div id="tree-area">
        <h2 style="margin-top:0; color: #2c3e50;">Árvore Evolutiva (Famílias)</h2>
        <ul id="tree-root"></ul>
    </div>

    <div class="overlay" id="modal-overlay"></div>
    <div id="manual-evo-modal" class="modal">
        <h3>Configurar Mudanças IPA</h3>
        <p style="font-size: 0.9em; color: #666;">As regras se adaptam às vogais definidas na língua mãe.</p>
        
        <div style="display: flex; flex-direction: column; gap: 8px;">
            <div><input type="checkbox" id="chk-lenition"> <label for="chk-lenition">Lenição (p,t,k,f,s -> b,d,g,v,z entre vogais)</label></div>
            <div><input type="checkbox" id="chk-apocope"> <label for="chk-apocope">Apócope (Queda de consoante final)</label></div>
            <div><input type="checkbox" id="chk-nasalization"> <label for="chk-nasalization">Nasalização (V + n/m -> Ṽ)</label></div>
            <div><input type="checkbox" id="chk-palatalization"> <label for="chk-palatalization">Palatalização (t,d,k,g + i/j -> tʃ,dʒ,ts...)</label></div>
            <div><input type="checkbox" id="chk-degemination"> <label for="chk-degemination">Degeminação (pp -> p, tt -> t)</label></div>
            
            <hr style="width: 100%; border: 0; border-top: 1px solid #eee;">
            
            <label>Substituição (Regex)</label>
            <input type="text" id="custom-regex-find" class="ipa-input" placeholder="Buscar (ex: a$)">
            <input type="text" id="custom-regex-replace" class="ipa-input" placeholder="Substituir por (ex: ə)">
        </div>
        <div style="margin-top: 20px; text-align: right;">
            <button onclick="closeManualEvo()">Cancelar</button>
            <button class="primary" onclick="evolveManual()">Aplicar Evolução</button>
        </div>
    </div>

    <script>
        // --- Estado Global ---
        let languages = []; 
        let nextId = 1;
        let selectedLangId = null;
        let lastFocusedInput = null;

        // --- Configuração do Teclado IPA ---
        document.querySelectorAll('.ipa-input').forEach(input => {
            input.addEventListener('focus', () => {
                if (lastFocusedInput) lastFocusedInput.classList.remove('active-input');
                lastFocusedInput = input;
                input.classList.add('active-input');
            });
        });

        document.querySelectorAll('.ipa-key').forEach(key => {
            key.addEventListener('click', () => {
                if (lastFocusedInput) {
                    const start = lastFocusedInput.selectionStart;
                    const end = lastFocusedInput.selectionEnd;
                    const text = lastFocusedInput.value;
                    const char = key.innerText;
                    lastFocusedInput.value = text.substring(0, start) + char + text.substring(end);
                    lastFocusedInput.focus();
                    lastFocusedInput.selectionStart = lastFocusedInput.selectionEnd = start + char.length;
                }
            });
        });

        // --- Utilitários ---
        const getRandom = (arr) => arr[Math.floor(Math.random() * arr.length)];
        const parseList = (str) => str.trim().split(/\s+/).filter(x => x);

        // --- Core: Gerador de Palavras ---
        function generateBaseWord(params) {
            const structure = params.structure;
            const sylCountParts = params.syllableRange.split('-');
            const minSyl = parseInt(sylCountParts[0]);
            const maxSyl = parseInt(sylCountParts[1] || sylCountParts[0]);
            const sylCount = Math.floor(Math.random() * (maxSyl - minSyl + 1)) + minSyl;

            let word = "";
            for (let i = 0; i < sylCount; i++) {
                structure.forEach(token => {
                    let type = token;
                    let isOptional = false;
                    if (token.endsWith('?')) {
                        isOptional = true;
                        type = token.slice(0, -1);
                    }
                    if (isOptional && Math.random() > 0.5) return;

                    if (type === 'C') word += getRandom(params.C);
                    else if (type === 'V') word += getRandom(params.V);
                    else if (type === 'F') word += getRandom(params.F);
                    else if (type === 'S') word += getRandom(params.S);
                    else word += type;
                });
            }
            return word;
        }

        // --- Core: Evolução Fonética (Lógica IPA) ---
        function getVowelRegex(vowelList) {
            // Cria um regex seguro com as vogais da língua atual
            const escapedVowels = vowelList.map(v => v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('');
            return new RegExp(`([${escapedVowels}])`, 'g');
        }
        
        function getVowelGroupRegex(vowelList) {
            const escapedVowels = vowelList.map(v => v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('');
            return `[${escapedVowels}]`;
        }

        function applyPhoneticChange(word, type, langParams) {
            let w = word;
            const V = getVowelGroupRegex(langParams.V); // Grupo de vogais ex: [aeiouə]
            
            switch(type) {
                case 'lenition':
                    // Vozeamento intervocálico e fricativização
                    // p->b, t->d, k->g, f->v, s->z, ʃ->ʒ
                    const regexIntervocalic = new RegExp(`(${V})([ptkf sʃ])(${V})`, 'g');
                    w = w.replace(regexIntervocalic, (match, v1, cons, v2) => {
                        const map = {'p':'b', 't':'d', 'k':'g', 'f':'v', 's':'z', 'ʃ':'ʒ'};
                        return v1 + (map[cons] || cons) + v2;
                    });
                    break;
                    
                case 'apocope':
                    // Remove qualquer coisa que NÃO seja vogal no final
                    const regexFinalCons = new RegExp(`[^${langParams.V.join('')}]$`);
                    if (regexFinalCons.test(w)) w = w.slice(0, -1);
                    break;
                    
                case 'nasalization':
                    // Vn -> Ṽ (simplificado para adicionar ~ em cima se possível, ou til depois)
                    // Aqui faremos uma substituição IPA simbólica. a -> ã, e -> ẽ, etc.
                    const nasalMap = {'a':'ã', 'e':'ẽ', 'i':'ĩ', 'o':'õ', 'u':'ũ', 'ə':'ə̃', 'ɛ':'ɛ̃', 'ɔ':'ɔ̃'};
                    const regexNasal = new RegExp(`(${V})[nm](?![${langParams.V.join('')}])`, 'g'); // Vogal + n/m (se não seguido de vogal)
                    w = w.replace(regexNasal, (match, v1) => {
                        return (nasalMap[v1] || v1 + '\u0303'); // Tenta mapa ou combinando til
                    });
                    break;
                    
                case 'palatalization':
                    // t, d, k, g + i/j/y -> tʃ, dʒ, tʃ, dʒ
                    // Precisamos identificar vogais anteriores altas. Vamos assumir i, j, y, ɪ
                    const frontHigh = '[ijyɪ]';
                    const regexPal = new RegExp(`([tdkg])(${frontHigh})`, 'g');
                    w = w.replace(regexPal, (match, cons, v) => {
                        const map = {'t':'tʃ', 'd':'dʒ', 'k':'tʃ', 'g':'dʒ'};
                        return (map[cons] || cons) + v;
                    });
                    break;
                    
                case 'degemination':
                    // Remove duplicatas (pp -> p)
                    w = w.replace(/(.)\1/g, '$1');
                    break;
            }
            return w;
        }

        function applyRegex(word, find, replace) {
            try { return word.replace(new RegExp(find, 'g'), replace); } catch (e) { return word; }
        }

        function applyHistory(word, changes, params) {
            let newWord = word;
            changes.forEach(change => {
                if (typeof change === 'string') {
                    newWord = applyPhoneticChange(newWord, change, params);
                } else if (typeof change === 'object' && change.type === 'regex') {
                    newWord = applyRegex(newWord, change.find, change.replace);
                }
            });
            return newWord;
        }

        // --- Core: Sistema de Línguas ---
        function getParamsFromUI() {
            return {
                C: parseList(document.getElementById('inp-consonants').value),
                V: parseList(document.getElementById('inp-vowels').value),
                F: parseList(document.getElementById('inp-finals').value),
                S: parseList(document.getElementById('inp-semivowels').value),
                structure: parseList(document.getElementById('inp-structure').value),
                syllableRange: document.getElementById('inp-syllables').value
            };
        }

        function createLanguage(parentId, newChanges = []) {
            let params, parentChanges = [];
            
            if (parentId === null) {
                params = getParamsFromUI();
            } else {
                const parent = languages.find(l => l.id === parentId);
                params = parent.params; 
                parentChanges = parent.changes;
            }

            const fullHistory = [...parentChanges, ...newChanges];

            // Gerar palavras (lexicon)
            let lexicon = [];
            for (let i = 0; i < 25; i++) {
                const base = generateBaseWord(params);
                lexicon.push(applyHistory(base, fullHistory, params));
            }

            // Gerar Nome do Zero
            let nameBase = generateBaseWord(params);
            let name = applyHistory(nameBase, fullHistory, params);
            // Capitalização simples
            name = name.charAt(0).toUpperCase() + name.slice(1);

            const newLang = {
                id: nextId++,
                parentId: parentId,
                name: name,
                lexicon: lexicon,
                params: params,
                changes: fullHistory,
                generation: parentId ? (languages.find(l => l.id === parentId).generation + 1) : 0
            };

            languages.push(newLang);
            renderTree();
            selectLanguage(newLang.id);
        }

        function generateRootLanguage() { createLanguage(null); }

        function deleteLanguage(id) {
            if(!confirm("Excluir esta língua e descendentes?")) return;
            const idsToDelete = [];
            function findChildren(currentId) {
                idsToDelete.push(currentId);
                const children = languages.filter(l => l.parentId === currentId);
                children.forEach(c => findChildren(c.id));
            }
            findChildren(id);
            languages = languages.filter(l => !idsToDelete.includes(l.id));
            if (selectedLangId && idsToDelete.includes(selectedLangId)) {
                selectedLangId = null;
                document.getElementById('current-lang-name').innerText = "(Nenhuma)";
                document.getElementById('word-list-area').innerText = "";
                disableButtons(true);
            }
            renderTree();
        }

        function evolve(strategies, customRegex = null) {
            if (selectedLangId === null) return;
            let newChanges = [...strategies];
            if (customRegex) newChanges.push({ type: 'regex', find: customRegex.find, replace: customRegex.replace });
            createLanguage(selectedLangId, newChanges);
        }

        // --- Funcionalidades Extras ---
        function generateMoreWords() {
            if (!selectedLangId) return;
            const lang = languages.find(l => l.id === selectedLangId);
            for(let i=0; i<10; i++){
                const base = generateBaseWord(lang.params);
                const evolved = applyHistory(base, lang.changes, lang.params);
                lang.lexicon.push(evolved);
            }
            updateDisplay();
        }

        function saveProject() {
            if(languages.length === 0) { alert("Nada para salvar."); return; }
            const data = JSON.stringify({ languages, nextId });
            const blob = new Blob([data], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'projeto_ipa.json';
            a.click();
        }

        function loadProject(input) {
            const file = input.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    languages = data.languages;
                    nextId = data.nextId;
                    selectedLangId = null;
                    renderTree();
                    alert("Projeto carregado!");
                } catch(err) { alert("Erro ao ler JSON."); }
            };
            reader.readAsText(file);
            input.value = '';
        }

        function exportWords() {
            if (!selectedLangId) return;
            const lang = languages.find(l => l.id === selectedLangId);
            const text = lang.lexicon.join('\n');
            const blob = new Blob([text], {type: 'text/plain;charset=utf-8'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `lexico_${lang.name}.txt`;
            a.click();
        }

        function importWords(input) {
            if (!selectedLangId) return;
            const file = input.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const newWords = text.split(/\r?\n/).filter(w => w.trim() !== "");
                const lang = languages.find(l => l.id === selectedLangId);
                lang.lexicon = [...lang.lexicon, ...newWords];
                updateDisplay();
                alert(`${newWords.length} palavras importadas.`);
            };
            reader.readAsText(file);
            input.value = '';
        }

        // --- UI Rendering ---
        function renderTree() {
            const rootContainer = document.getElementById('tree-root');
            rootContainer.innerHTML = '';
            const roots = languages.filter(l => l.parentId === null);
            roots.forEach(root => rootContainer.appendChild(createNodeElement(root)));
        }

        function createNodeElement(lang) {
            const li = document.createElement('li');
            const container = document.createElement('div');
            container.className = 'lang-node-container';

            const span = document.createElement('span');
            span.className = 'lang-node';
            if (lang.id === selectedLangId) span.classList.add('selected');
            span.innerText = lang.name;
            span.onclick = (e) => { e.stopPropagation(); selectLanguage(lang.id); };

            const delBtn = document.createElement('span');
            delBtn.className = 'delete-btn';
            delBtn.innerHTML = '×';
            delBtn.onclick = (e) => { e.stopPropagation(); deleteLanguage(lang.id); };

            container.appendChild(span);
            container.appendChild(delBtn);
            li.appendChild(container);

            const children = languages.filter(l => l.parentId === lang.id);
            if (children.length > 0) {
                const ul = document.createElement('ul');
                children.forEach(child => ul.appendChild(createNodeElement(child)));
                li.appendChild(ul);
            }
            return li;
        }

        function selectLanguage(id) {
            selectedLangId = id;
            updateDisplay();
            renderTree();
            disableButtons(false);
        }

        function updateDisplay() {
            if(!selectedLangId) return;
            const lang = languages.find(l => l.id === selectedLangId);
            document.getElementById('current-lang-name').innerText = lang.name;
            document.getElementById('word-list-area').innerText = lang.lexicon.join(",  ");
        }

        function disableButtons(disable) {
            ['btn-add-words', 'btn-export-txt', 'btn-import-txt', 'btn-evo-rand', 'btn-evo-man'].forEach(id => 
                document.getElementById(id).disabled = disable
            );
        }

        // --- Handlers UI ---
        function evolveRandom() {
            const changes = ['lenition', 'apocope', 'nasalization', 'palatalization', 'degemination'];
            const numChanges = Math.random() > 0.7 ? 2 : 1;
            let strategies = [];
            for(let i=0; i<numChanges; i++) strategies.push(getRandom(changes));
            evolve(strategies);
        }

        function openManualEvo() {
            document.getElementById('modal-overlay').style.display = 'block';
            document.getElementById('manual-evo-modal').style.display = 'block';
        }
        function closeManualEvo() {
            document.getElementById('modal-overlay').style.display = 'none';
            document.getElementById('manual-evo-modal').style.display = 'none';
        }
        function evolveManual() {
            let strategies = [];
            if (document.getElementById('chk-lenition').checked) strategies.push('lenition');
            if (document.getElementById('chk-apocope').checked) strategies.push('apocope');
            if (document.getElementById('chk-nasalization').checked) strategies.push('nasalization');
            if (document.getElementById('chk-palatalization').checked) strategies.push('palatalization');
            if (document.getElementById('chk-degemination').checked) strategies.push('degemination');
            
            let customRegex = null;
            const find = document.getElementById('custom-regex-find').value;
            const rep = document.getElementById('custom-regex-replace').value;
            if (find) customRegex = { find, replace: rep };

            evolve(strategies, customRegex);
            closeManualEvo();
            
            // Reset
            document.querySelectorAll('#manual-evo-modal input[type="checkbox"]').forEach(c => c.checked = false);
            document.getElementById('custom-regex-find').value = "";
            document.getElementById('custom-regex-replace').value = "";
        }
    </script>
</body>
</html>
